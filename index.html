<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4A1259">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ileva Consultor">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <title>ileva · App do Consultor (protótipo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet"

  <style>
    :root {
      --campo-fonte: clamp(12px, 3.33vw, 14px);
      --tela-margem: 8px
    }

    html.is-desktop {
      --campo-fonte: 13px
    }

    .campo {
      font-size: var(--campo-fonte)
    }

    body {
      margin: 0;
      background: #eef1f9
    }

    .ms {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      white-space: nowrap;
      display: inline-block;
      font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased
    }

    .nosb {
      scrollbar-width: none
    }

    .nosb::-webkit-scrollbar {
      display: none
    }

    main>*,
    [aria-label="Menu"]>* {
      flex-shrink: 0
    }

    html,
    body {
      height: 100%
    }

    .app-root {
      height: 100vh !important;
      height: 100dvh !important
    }

    a {
      color: #4A1259
    }

    a:hover {
      color: #4A1259
    }

    @keyframes sheetUp {
      from {
        transform: translateY(100%)
      }

      to {
        transform: translateY(0)
      }
    }

    @keyframes lupaBusca {
      0%, 100% {
        transform: translate(-58px, 6px) rotate(-10deg)
      }

      25% {
        transform: translate(-8px, -10px) rotate(0deg) scale(1.08)
      }

      50% {
        transform: translate(54px, 4px) rotate(10deg)
      }

      75% {
        transform: translate(4px, 14px) rotate(0deg) scale(1.08)
      }
    }

    @keyframes placaScan {
      0% {
        left: -30%
      }

      100% {
        left: 110%
      }
    }

    @keyframes pontoPulse {
      0%, 80%, 100% {
        opacity: .25
      }

      40% {
        opacity: 1
      }
    }

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: .28s;
      animation-timing-function: cubic-bezier(.22, 1, .36, 1)
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent
    }

    button:not([aria-disabled="true"]):not(:disabled):active,
    a:active {
      transform: scale(.97);
      transition: transform .12s ease-out
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important
      }
    }

    @keyframes stepShimmer {
      0% {
        background-position: 100% 0
      }

      100% {
        background-position: -100% 0
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .menu-panel {
      will-change: transform, opacity
    }

    .menu-in {
      animation: menuIn .42s cubic-bezier(.22, 1, .36, 1) both
    }

    .menu-out {
      animation: menuOut .26s cubic-bezier(.4, 0, 1, 1) both
    }

    .menu-in .menu-avatar {
      animation: avatarPop .5s cubic-bezier(.34, 1.56, .64, 1) .08s both
    }

    .menu-in .menu-stagger>* {
      animation: itemIn .45s cubic-bezier(.22, 1, .36, 1) both
    }

    .menu-in .menu-stagger>*:nth-child(1) {
      animation-delay: .10s
    }

    .menu-in .menu-stagger>*:nth-child(2) {
      animation-delay: .15s
    }

    .menu-in .menu-stagger>*:nth-child(3) {
      animation-delay: .20s
    }

    .menu-in .menu-stagger>*:nth-child(4) {
      animation-delay: .25s
    }

    .menu-close {
      transition: transform .25s cubic-bezier(.22, 1, .36, 1), filter .2s ease
    }

    .menu-close:hover {
      transform: rotate(90deg);
      filter: brightness(1.15)
    }

    .menu-close:active {
      transform: scale(.92)
    }

    .fab-glass {
      transition: transform .25s cubic-bezier(.22, 1, .36, 1), filter .2s ease
    }

    .fab-glass:hover {
      transform: scale(1.05);
      filter: brightness(1.1)
    }

    .fab-glass:active {
      transform: scale(.92)
    }

    .ia-fab {
      transition: transform .25s cubic-bezier(.22, 1, .36, 1), filter .2s ease
    }

    .ia-fab:hover {
      filter: brightness(1.1);
      transform: scale(1.05)
    }

    .ia-fab:active {
      transform: scale(.92)
    }

    .ia-icon {
      transition: transform .3s cubic-bezier(.22, 1, .36, 1)
    }

    .ia-menu {
      transform-origin: bottom right;
      animation: iaMenuIn .32s cubic-bezier(.22, 1, .36, 1) both
    }

    .ia-menu>* {
      animation: itemIn .38s cubic-bezier(.22, 1, .36, 1) both
    }

    .ia-menu>*:nth-child(8) {
      animation-delay: 0s
    }

    .ia-menu>*:nth-child(7) {
      animation-delay: .02s
    }

    .ia-menu>*:nth-child(6) {
      animation-delay: .03s
    }

    .ia-menu>*:nth-child(5) {
      animation-delay: .05s
    }

    .ia-menu>*:nth-child(4) {
      animation-delay: .07s
    }

    .ia-menu>*:nth-child(3) {
      animation-delay: .11s
    }

    .ia-menu>*:nth-child(2) {
      animation-delay: .15s
    }

    .ia-menu>*:nth-child(1) {
      animation-delay: .19s
    }

    .ia-lista>* {
      flex-shrink: 0;
      animation: itemIn .38s cubic-bezier(.22, 1, .36, 1) both
    }

    .ia-lista>*:nth-child(1) {
      animation-delay: 0.060s
    }

    .ia-lista>*:nth-child(2) {
      animation-delay: 0.095s
    }

    .ia-lista>*:nth-child(3) {
      animation-delay: 0.130s
    }

    .ia-lista>*:nth-child(4) {
      animation-delay: 0.165s
    }

    .ia-lista>*:nth-child(5) {
      animation-delay: 0.200s
    }

    .ia-lista>*:nth-child(6) {
      animation-delay: 0.235s
    }

    .ia-lista>*:nth-child(7) {
      animation-delay: 0.270s
    }

    .cot-menu {
      transform-origin: bottom center;
      animation: iaMenuIn .32s cubic-bezier(.22, 1, .36, 1) both
    }

    .cot-menu>* {
      animation: itemIn .38s cubic-bezier(.22, 1, .36, 1) both
    }

    .cot-menu>*:nth-child(3) {
      animation-delay: .05s
    }

    .cot-menu>*:nth-child(2) {
      animation-delay: .10s
    }

    .cot-menu>*:nth-child(1) {
      animation-delay: .15s
    }

    .fab-glass:hover .ia-icon {
      transform: none
    }

    input[type=date],
    input[type=time] {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      min-width: 0;
      max-width: 100%;
      width: 100%;
      box-sizing: border-box;
      line-height: 46px;
      text-align: left

    input[type=date]::-webkit-date-and-time-value,
    input[type=time]::-webkit-date-and-time-value {
      text-align: left;
      margin: 0
    }

    input[type=date]::-webkit-calendar-picker-indicator,
    input[type=time]::-webkit-calendar-picker-indicator {
      opacity: .6
    }

    label {
      min-width: 0
    }

    .pulse-dot {
      animation: pulseDot 1.6s ease-in-out infinite
    }

        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.6)
      }

      50% {

      }
    }

    .drag-row {
      cursor: grab;
      user-select: none;
      -webkit-user-select: none
    }

    .drag-row.is-dragging {
      cursor: grabbing
    }

    .drag-row.is-dragging,
    .drag-row.is-gliding {
      scroll-snap-type: none !important;
      scroll-behavior: auto !important
    }

    .drag-row.is-dragging>* {
      pointer-events: none
    }

    .drag-row.is-dragging * {

    }

    /* O menu de baixo fica na frente de todas as camadas do app */
    .nav-inferior,
    .nav-raised {
      z-index: 50 !important
    }

    .acc-panel {
      animation: accIn .28s cubic-bezier(.22, 1, .36, 1) both;
      transform-origin: top
    }

    @keyframes accIn {
      from {
        opacity: 0;
        transform: translateY(-6px)
      }

      to {
        opacity: 1;
        transform: none

    }

    .prop-card {

    .prop-card:hover {

    .prop-act {
      transition: background .15s ease
    }

    .prop-act:hover {

    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      /* roxo desde o primeiro desenho: o iPhone usa essa cor atrás da barra de status */
      background-color: #4A1259
    }

    .step-card {
      animation: itemIn .3s cubic-bezier(.22, 1, .36, 1) both
    }

    .price-pop {
      animation: avatarPop .35s cubic-bezier(.34, 1.56, .64, 1)
    }

    .story>span:first-child {
      transition: transform .2s cubic-bezier(.22, 1, .36, 1)
    }

    .story:hover>span:first-child {
      transform: scale(1.05)
    }

    .story:active>span:first-child {
      transform: scale(.92)
    }

    .lamp-btn {
      transition: transform .2s cubic-bezier(.22, 1, .36, 1)
    }

    .lamp-btn:hover {
      transform: translateX(2px)
    }

    .lamp-btn:active {
      transform: scale(.94)
    }

    .ia-menu.ia-menu-center {
      transform-origin: center center
    }

    .ia-menu-center::-webkit-scrollbar {
      display: none
    }

    .agenda-card {
      transition: box-shadow .2s ease
    }

    .agenda-card:hover {
      box-shadow: 0 8px 20px -8px rgba(74, 18, 89, 0.25) !important
    }

    .multi-card {
      transition: transform .2s cubic-bezier(.22, 1, .36, 1), box-shadow .2s ease
    }

    .multi-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -8px rgba(74, 18, 89, 0.28) !important
    }

    .multi-card:active {
      transform: scale(.98)
    }

    .multi-list>* {
      flex-shrink: 0;
      animation: itemIn .42s cubic-bezier(.22, 1, .36, 1) both
    }

    .multi-list>*:nth-child(1) {
      animation-delay: .10s
    }

    .multi-list>*:nth-child(2) {
      animation-delay: .15s
    }

    .multi-list>*:nth-child(3) {
      animation-delay: .20s
    }

    .multi-list>*:nth-child(4) {
      animation-delay: .25s
    }

    .ia-opt {
      transition: transform .2s cubic-bezier(.22, 1, .36, 1)
    }

    .ia-opt:hover {
      transform: translateX(-3px)
    }

    .ia-opt:active {
      transform: scale(.98)
    }

    @keyframes iaMenuIn {
      from {
        transform: scale(.85) translateY(12px);
        opacity: 0
      }

      to {
        transform: scale(1) translateY(0);
        opacity: 1
      }
    }

    .cta-perf {
      transition: transform .2s cubic-bezier(.22, 1, .36, 1), box-shadow .2s ease
    }

    .cta-perf:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -6px rgba(74, 18, 89, 0.3) !important
    }

    .cta-perf:active {
      transform: scale(.98)
    }

    .dicas-list>* {
      flex-shrink: 0;
      animation: itemIn .45s cubic-bezier(.22, 1, .36, 1) both
    }

    .dicas-list>*:nth-child(1) {
      animation-delay: .12s
    }

    .dicas-list>*:nth-child(2) {
      animation-delay: .17s
    }

    .dicas-list>*:nth-child(3) {
      animation-delay: .22s
    }

    .dicas-list>*:nth-child(4) {
      animation-delay: .27s
    }

    .dicas-list>*:nth-child(5) {
      animation-delay: .32s
    }

    @keyframes menuIn {
      from {
        transform: translateX(100%);
        opacity: .6
      }

      to {
        transform: translateX(0);
        opacity: 1
      }
    }

    @keyframes menuOut {
      from {
        transform: translateX(0);
        opacity: 1
      }

      to {
        transform: translateX(100%);
        opacity: .6
      }
    }

    @keyframes avatarPop {
      from {
        transform: scale(.7);
        opacity: 0
      }

      to {
        transform: scale(1);
        opacity: 1
      }
    }

    @keyframes itemIn {
      from {
        transform: translateX(24px);
        opacity: 0
      }

      to {
        transform: translateX(0);
        opacity: 1
      }
    }

    @media (prefers-reduced-motion: reduce) {

      [role=dialog],
      .menu-in,
      .menu-out,
      .menu-in *,
      .dicas-list>*,
      .ia-menu,
      .ia-menu>*,
      .cot-menu,
      .cot-menu>*,
      .multi-list>*,
      .pulse-dot {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
  <style>
    /* ===== Detecção de dispositivo: mobile ocupa a tela toda; desktop mostra o app dentro de um celular ===== */
    html,
    body {
      margin: 0;
      height: 100%
    }

    #root {
      height: 100%
    }

    /* Fundo por trás do app no celular: roxo em cima (barra de status) e branco embaixo (cor do menu),
       para nenhuma sobra do iPhone aparecer como faixa clara no topo ou roxa embaixo do menu */
    html.is-mobile,
    html.is-mobile body {
      /* a cor (não a imagem) é o que o iPhone usa no topo; sem ela aparecia um degradê branco */
      background-color: #4A1259;
      background-image: linear-gradient(#4A1259 50%, #ffffff 50%);
      overscroll-behavior: none
    }

    /* No celular o app ocupa toda a área que o sistema entrega. No iPhone instalado essa área pode
       terminar antes da borda; a sobra embaixo mostra o fundo branco da página, como continuação do menu */
    html.is-mobile .app-root {
      position: fixed !important;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      height: auto !important;
      max-width: none !important;
      padding-top: env(safe-area-inset-top, 0px);
      /* altura do menu de baixo: 72px, ou mais baixo e encostado na borda quando há a barrinha do iPhone */
      --rodape: env(safe-area-inset-bottom, 0px);
      --menu: max(72px, calc(56px + var(--rodape)));
      /* faixa da barra de status (hora, bateria) na cor da marca, para o texto branco ficar legível */
      background: linear-gradient(#4A1259 0 env(safe-area-inset-top, 0px), #eef1f9 0) !important
    }

    /* Janelas, fundos escuros e o menu lateral ficam entre a barra de status e o menu de baixo */
    /* Sobra espaço abaixo do app (ver script de detecção): menu mais baixo, ícones encostados no limite */
    html.is-mobile.sobra-embaixo .app-root {
      --rodape: 0px;
      --menu: 64px
    }

    html.is-mobile.sobra-embaixo .app-root .nav-inferior {
      padding-bottom: 2px !important
    }

    html.is-mobile .app-root .janela {
      top: env(safe-area-inset-top, 0px) !important;
      bottom: var(--menu) !important
    }

    /* Menu de baixo encostado na borda do aparelho; os ícones ficam acima da barrinha do iPhone */
    html.is-mobile .app-root .nav-inferior {
      height: var(--menu) !important;
      padding-bottom: max(8px, calc(var(--rodape) - 14px)) !important
    }

    html.is-mobile .app-root .painel {
      bottom: var(--menu) !important
    }

    html.is-mobile .app-root .cot-menu.acima-menu {
      bottom: calc(var(--menu) + 20px) !important
    }

    html.is-mobile .app-root [aria-labelledby="guia-tit"].acima-menu {
      bottom: calc(var(--menu) + 16px) !important
    }

    /* Painéis que sobem de baixo nunca passam para baixo da barra de status */
    html.is-mobile .app-root .painel {
      max-height: calc(100% - env(safe-area-inset-top, 0px) - var(--menu) - 16px) !important
    }

    html.is-desktop body {
      background: radial-gradient(circle at 20% 10%, #f4f0f5 0%, #e6dfe9 45%, #d9cfdc 100%);
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif
    }

    html.is-desktop .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 56px
    }

    html.is-desktop .device {
      position: relative;
      flex-shrink: 0;
      width: 390px;
      height: 844px;
      border-radius: 52px;
      padding: 12px;
      background: #1b1420;
      box-shadow: 0 40px 80px -24px rgba(32, 7, 38, .55), inset 0 0 0 2px #3a2e40;
      transform-origin: center
    }

    html.is-desktop .screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      overflow: hidden;
      background: #eef1f9;
      transform: translateZ(0)
    }

    html.is-desktop .screen .app-root {
      height: 100% !important;
      max-width: none !important
    }

    html.is-desktop .info {
      max-width: 300px;
      color: #350C40
    }

    html.is-desktop .info h1 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 32px;
      letter-spacing: -.02em
    }

    html.is-desktop .info p {
      margin: 0 0 14px;
      font-size: 14px;
      line-height: 21px;
      color: #622773
    }

    html.is-desktop .info .tag {
      display: inline-block;
      margin-bottom: 14px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: #4A1259;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em
    }

    html.is-mobile .info {
      display: none
    }

    @media (max-width:820px) {
      html.is-desktop .info {
        display: none
      }
    }
  </style>
</head>

        return Math.round(plan.base * factor * cota.mult * 10) / 10;

        let h = 0; for (const ch of modelo + ano) h = (h * 31 + ch.charCodeAt(0)) % 999999;

      linkCliente(st, cat, plansSel, extrasSel) {
        const abs = (u) => { try { return new URL(u, window.location.href).href; } catch (e) { return u; } };
        const extrasTotal = extrasSel.reduce((t, x) => t + x.price, 0);
        const dados = {
          n: st.wGenNum,
          data: '30/09/2026',
          cli: {
            nome: st.wNome.trim(),
            fone: (st.wPais && st.wPais !== 'BR' ? '+' + this.dialOf(st.wPais) + ' ' : '') + st.wFone,
            email: st.wEmail.trim(),
            cidade: st.wCidade && st.wUf ? st.wCidade + '/' + st.wUf : '',
            doc: st.wCpf,
            frota: st.wFrota === 'sim' ? st.wFrotaNome.trim() : ''
          },
          vei: {
            tipo: { carro: 'Carro', moto: 'Moto', caminhao: 'Caminhão' }[st.wTipo] || 'Veículo',
            marca: st.wMarca, modelo: st.wModelo, curto: st.wModelo.split(' ')[0], ano: st.wAno,
            fuel: st.wTipo === 'caminhao' ? 'Diesel' : Number(st.wAno) < 2006 ? 'Gasolina' : 'Flex',
            placa: st.wPlaca, fipe: st.wFipe || 0, code: st.wCode,
            foto: abs(Component.vehFoto(st.wTipo)), logo: this.marcaLogo(st.wMarca)
          },
          planos: plansSel.map((pl) => {
            const cota = cat.cotas.find((c) => c.id === (st.wCotas[pl.id] || '0'));
            const base = this.planPrice(pl, st.wFipe || 20000, st.wCotas[pl.id]);
            return {
              nome: pl.name, tag: pl.tag || '',
              base, preco: base == null ? null : Math.round((base + extrasTotal) * 100) / 100,
              cota: pl.base == null ? '' : cota.label.split(' · ')[0],
              part: pl.base == null ? '' : (cota.label.split('participação ')[1] || ''),
              adesao: this.wizAdesao(pl),
              beneficios: this.planBenefitsComparados(pl).map((b) => ({ t: b.t, n: b.icon === 'cancel' ? 1 : 0 }))
            };
          }),
          incl: extrasSel.map((x) => ({ label: x.label, preco: x.price })),
          opc: cat.extras.filter((x) => !st.wExtras.some((it) => it.id === x.id)).map((x) => ({ label: x.label, preco: x.price, icon: x.icon })),
          cons: { nome: 'Carlos Eduardo', fone: '(62) 99999-0000', wa: this.waNum('(62) 99999-0000', 'BR'), regiao: 'Regional Centro-Oeste', foto: abs('assets/foto-perfil.jpg') }
        };
        const bytes = new TextEncoder().encode(JSON.stringify(dados));
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        const cod = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        return abs('proposta.html') + '#d=' + cod;
      }

      detVals() {
        const st = this.state;
        const cat = Component.ccCatalog();
        const all = this.propostas || (this.propostas = Component.seedPropostas());
        const p = all.find((x) => x.id === st.detPid);
        const etapas = Component.propCatalog().etapas;
        const noop = () => { };
        const blank = { detOpen: false, det: {}, detSteps: [], detPlanChips: [], s1PlanOpts: [], s1CotaOpts: [], s2Tasks: [], detExtras: [], detHist: [], vTipoOpts: [] };
        const toast = (t) => { this.setState({ detToast: t }); clearTimeout(this.detTimer); this.detTimer = setTimeout(() => this.setState({ detToast: '' }), 2500); };
        const base = {
          detToastVisible: !!st.detToast, detToast: st.detToast,
          dsOpen: !!st.ds && !!p, cfOpen: !!st.cf && !!p,
          closeDs: () => this.setState({ ds: null }), closeCf: () => this.setState({ cf: null })
        };
        if (!p) return { ...blank, ...base, dsOpen: false, cfOpen: false };

        // ensure detail fields for seeded proposals
        if (p.num == null) {
          const [mdl, ...rest] = p.model.split(' ');
          Object.assign(p, {
            num: 1000 + Number(p.id.replace(/\D/g, '')), email: '', marca: '', ano: (p.model.match(/\d{4}/) || ['2021'])[0], fuel: 'Flex',
            fipe: p.type === 'caminhao' ? 245000 : p.type === 'moto' ? 18500 : 64000, code: '00' + p.id.replace(/\D/g, '').padStart(4, '0') + '-3',
            plans: ['esmeralda', 'diamante'], cotas: {}, extras: [], tasks: {},
            stage: p.status === 'funil' ? etapas.indexOf(p.etapa) + 1 : p.status === 'ativada' ? etapas.length + 1 : 0,
            history: [{ t: 'Proposta criada', d: p.created.split('-').reverse().join('/') + ' · ' + (p.origem || 'Aplicativo') }]
          });
          p.protegido = p.fipe;
          const doneUpTo = p.status === 'ativada' ? etapas.length : p.stage - 1;
          p.tasks = { perguntas: doneUpTo >= 1, dados: doneUpTo >= 2, veiculo: doneUpTo >= 2, vistoria: doneUpTo >= 3, vistoriaInfo: doneUpTo >= 3 ? 'Vistoria padrão · Próprio consultor' : '', termoEnviado: doneUpTo >= 4, termo: doneUpTo >= 4 };

          if (p.status === 'ativada') p.history.push({ t: 'Proposta ativada', d: p.activated.split('-').reverse().join('/') });
          if (p.status === 'arquivada') p.history.push({ t: 'Proposta arquivada', d: p.event });
          if (p.status === 'transferida') p.history.push({ t: 'Proposta transferida', d: p.event });
        }

      dragRow(key, opts = {}) {
        this.rowEls = this.rowEls || {};
        const snap = opts.snap || 0;
        const ease = (t) => 1 - Math.pow(1 - t, 3);
        const animateTo = (el, target, duration) => {
          cancelAnimationFrame(this.rowAnim);
          const from = el.scrollLeft;
          const max = el.scrollWidth - el.clientWidth;
          const to = Math.max(0, Math.min(max, target));
          const start = performance.now();
          const step = (now) => {
            const t = Math.min(1, (now - start) / duration);
            el.scrollLeft = from + (to - from) * ease(t);
            if (t < 1) this.rowAnim = requestAnimationFrame(step);
            else el.classList.remove('is-gliding');
          };
          el.classList.add('is-gliding');
          this.rowAnim = requestAnimationFrame(step);
        };
        return {
          ref: (el) => { this.rowEls[key] = el; },
          down: (e) => {
            const el = this.rowEls[key];
            if (e.button !== 0 || !el) return;
            cancelAnimationFrame(this.rowAnim);
            el.classList.remove('is-gliding');
            this.rowDrag = { key, startX: e.pageX, start: el.scrollLeft, moved: false, lastX: e.pageX, lastT: performance.now(), v: 0 };
          },
          move: (e) => {
            const d = this.rowDrag;
            if (!d || d.key !== key) return;
            const el = this.rowEls[key];
            const dist = e.pageX - d.startX;
            if (!d.moved && Math.abs(dist) > 5) { d.moved = true; el.classList.add('is-dragging'); }
            if (!d.moved) return;
            e.preventDefault();
            const now = performance.now();
            const dt = Math.max(1, now - d.lastT);
            d.v = 0.8 * ((e.pageX - d.lastX) / dt) + 0.2 * d.v;
            d.lastX = e.pageX; d.lastT = now;
            d.target = d.start - dist;
            if (!d.raf) d.raf = requestAnimationFrame(() => { d.raf = null; el.scrollLeft = d.target; });
          },
          up: () => {
            const d = this.rowDrag;
            if (!d || d.key !== key) return;
            this.rowDrag = null;
            const el = this.rowEls[key];
            if (!el) return;
            el.classList.remove('is-dragging');
            if (!d.moved) return;
            this.justDragged = true;
            setTimeout(() => { this.justDragged = false; }, 50);
            const momentum = -d.v * 220;
            const projected = (d.target ?? el.scrollLeft) + momentum;
            const target = snap ? Math.round(projected / snap) * snap : projected;
            animateTo(el, target, snap ? 420 : 520);
          }
        };
      }

      maskPhone(v, iso) {
        if ((iso || 'BR') !== 'BR') return v.replace(/\D/g, '').slice(0, 15);
        const d = v.replace(/\D/g, '').slice(0, 11);
        if (d.length <= 2) return d ? '(' + d : '';
        if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
        if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
        return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
      }

      maskDoc(v) {
        const d = v.replace(/\D/g, '').slice(0, 14);
        if (d.length <= 11) {
          return d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
        }
        return d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
      }

      homeCalVals() {
        const pad = (n) => String(n).padStart(2, '0');
        const agora = new Date();
        const today = agora.getFullYear() + '-' + pad(agora.getMonth() + 1) + '-' + pad(agora.getDate());
        const [y, m, d] = today.split('-').map(Number);
        const lead = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
        const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
        const meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
        const dias = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
        const lembretes = this.state.notas.filter((n) => n.alertDate);
        const abrirDia = (iso) => this.setState({ agendaOpen: true, agendaTab: 'lembretes', agendaFilter: 'todos', agendaView: 'calendario', calDay: iso, calMonth: iso.slice(0, 7) });
        const cells = Array.from({ length: lead + daysInMonth }, (_, i) => {
          const day = i - lead + 1;
          if (day < 1) return { empty: true, isDay: false, day: '', label: '', pick: () => {}, style: 'height:22px', dotStyle: 'display:none' };
          const iso = y + '-' + pad(m) + '-' + pad(day);
          const wd = i % 7;
          const isToday = iso === today;
          const qtd = lembretes.filter((n) => n.alertDate === iso).length;
          return {
            empty: false,
            isDay: true,
            day,
            label: day + ' de ' + meses[m - 1] + (qtd ? ', ' + qtd + (qtd > 1 ? ' agendamentos' : ' agendamento') : ''),
            pick: () => abrirDia(iso),
            style: 'position:relative;width:22px;height:22px;margin:0 auto;padding:0;border:0;border-radius:9999px;font-family:inherit;font-size:11px;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;cursor:pointer;'
              + (isToday ? 'background:#4A1259;color:#ffffff;font-weight:800' : 'background:transparent;font-weight:600;color:' + (wd === 0 || wd === 6 ? '#a7a0b2' : '#0b1c30')),
            dotStyle: qtd ? 'position:absolute;bottom:-2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:9999px;background:' + (isToday ? '#f59e0b' : iso < today ? '#d92d20' : '#A192A6') : 'display:none'
          };
        });
        const hoje = lembretes.filter((n) => n.alertDate === today).sort((a, b) => a.alertTime.localeCompare(b.alertTime));
        return {
          hcDiaSemana: dias[new Date(Date.UTC(y, m - 1, d)).getUTCDay()],
          hcDia: d,
          hcMes: meses[m - 1],
          hcSemana: ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map((l, i) => ({ l, style: 'text-align:center;font-size:10px;line-height:12px;font-weight:700;color:' + (i === 0 || i === 6 ? '#a7a0b2' : '#4a4455') })),
          hcCells: cells,
          hcTemEventos: hoje.length > 0,
          hcSemEventos: hoje.length === 0,
          hcEventos: hoje.slice(0, 2).map((n) => ({ hora: n.alertTime, titulo: n.title, abrir: () => abrirDia(today) })),
          hcMais: hoje.length > 2 ? '+' + (hoje.length - 2) + ' hoje' : '',
          hcAbrirHoje: () => abrirDia(today)
        };
      }

      agendaVals() {
        const { agendaTab, agendaFilter, notas } = this.state;
        const today = '2026-09-30';
        const lembretes = notas.filter((n) => n.alertDate);
        const anotacoes = notas.filter((n) => !n.alertDate);
        const statusOf = (n) => (n.alertDate < today ? 'atrasado' : n.alertDate === today ? 'hoje' : 'proximo');
        const statusMeta = {
          atrasado: { label: 'Atrasado', color: '#b42318', bg: '#fee4e2' },

          proximo: { label: 'Agendado', color: '#4A1259', bg: '#ece6ee' }
        };
        const filters = [
          { id: 'todos', label: 'Todos' },
          { id: 'hoje', label: 'Hoje' },
          { id: 'proximo', label: 'Próximos' },
          { id: 'atrasado', label: 'Atrasados' }
        ];
        let list = agendaTab === 'lembretes' ? lembretes : anotacoes;
        if (agendaTab === 'lembretes') {
          if (agendaFilter !== 'todos') list = list.filter((n) => statusOf(n) === agendaFilter);
          list = [...list].sort((a, b) => (a.alertDate + a.alertTime).localeCompare(b.alertDate + b.alertTime));

        const hojeCount = lembretes.filter((n) => statusOf(n) === 'hoje').length;
        const atrasados = lembretes.filter((n) => statusOf(n) === 'atrasado').length;
        return {

                + (sel ? 'background:#4A1259;color:#ffffff;' : 'background:#dce3f2;color:#4a4455;')
            };
          }),

            const sel = f.id === agendaFilter;
            return {

      calendarVals() {
        const { agendaView, calMonth, calDay, notas } = this.state;
        const today = '2026-09-30';
        const pad = (n) => String(n).padStart(2, '0');
        const [y, m] = calMonth.split('-').map(Number);
        const first = new Date(Date.UTC(y, m - 1, 1));
        const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
        const lead = first.getUTCDay();
        const total = Math.ceil((lead + daysInMonth) / 7) * 7;
        const meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
        const lembretes = notas.filter((n) => n.alertDate);
        const colorOf = (d) => (d < today ? '#d92d20' : d === today ? '#f59e0b' : '#4A1259');
        const shiftMonth = (delta) => {
          const d = new Date(Date.UTC(y, m - 1 + delta, 1));
          return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1);
        };
        const cells = Array.from({ length: total }, (_, i) => {
          const date = new Date(Date.UTC(y, m - 1, i - lead + 1));
          const iso = date.getUTCFullYear() + '-' + pad(date.getUTCMonth() + 1) + '-' + pad(date.getUTCDate());
          const inMonth = date.getUTCMonth() === m - 1;
          const isToday = iso === today;
          const selected = iso === calDay;
          const dayItems = lembretes.filter((n) => n.alertDate === iso);
          return {
            day: date.getUTCDate(),
            label: date.getUTCDate() + ' de ' + meses[date.getUTCMonth()] + (dayItems.length ? ', ' + dayItems.length + ' agendamento' + (dayItems.length > 1 ? 's' : '') : ''),
            selected: selected ? 'true' : 'false',
            pick: () => this.setState({ calDay: iso, calMonth: iso.slice(0, 7) }),
            style: 'height:44px;padding:0;border:0;border-radius:12px;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:background .15s;'
              + (selected ? 'background:#4A1259;' : isToday ? 'background:#ece6ee;' : 'background:transparent;'),
            numStyle: 'font-size:13px;line-height:16px;font-weight:' + (isToday || selected ? '800' : '600') + ';color:'
              + (selected ? '#ffffff' : !inMonth ? '#ccc3d8' : isToday ? '#4A1259' : '#0b1c30'),
            dots: dayItems.slice(0, 3).map(() => ({
              style: 'width:5px;height:5px;border-radius:9999px;background:' + (selected ? '#ffffff' : colorOf(iso))
            }))
          };
        });
        const [sy, sm, sd] = calDay.split('-');
        const statusMeta = (d) => (d < today
          ? { label: 'Atrasado', color: '#b42318', bg: '#fee4e2' }
          : d === today ? { label: 'Hoje', color: '#b45309', bg: '#fef0c7' } : { label: 'Agendado', color: '#4A1259', bg: '#ece6ee' });
        const items = lembretes.filter((n) => n.alertDate === calDay).sort((a, b) => a.alertTime.localeCompare(b.alertTime));
        return {
          agendaIsLista: agendaView === 'lista',
          agendaIsCal: agendaView === 'calendario',
          viewToggleIcon: agendaView === 'lista' ? 'calendar_month' : 'view_agenda',
          viewToggleText: agendaView === 'lista' ? 'Calendário' : 'Lista',
          viewToggleLabel: agendaView === 'lista' ? 'Ver em calendário' : 'Ver em lista',
          toggleAgendaView: () => this.setState({ agendaView: agendaView === 'lista' ? 'calendario' : 'lista' }),
          viewOptions: [
            { id: 'lista', label: 'Lista', icon: 'view_agenda' },
            { id: 'calendario', label: 'Calendário', icon: 'calendar_month' }
          ].map((o) => {
            const sel = o.id === agendaView;
            return {
              ...o,
              selected: sel ? 'true' : 'false',
              pick: () => this.setState({ agendaView: o.id }),
              style: 'height:34px;padding:0 10px;border:0;border-radius:9999px;font-family:inherit;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;cursor:pointer;transition:all .2s;'
                + (sel ? 'background:#ffffff;color:#4A1259;box-shadow:0 2px 6px -2px rgba(32, 7, 38,0.25);' : 'background:transparent;color:#4a4455;')
            };
          }),
          isDefaultView: agendaView === this.state.agendaDefault,
          defaultLabel: agendaView === this.state.agendaDefault ? 'Padrão' : 'Definir padrão',
          defaultAria: agendaView === this.state.agendaDefault ? (agendaView === 'lista' ? 'Lista' : 'Calendário') + ' é a visualização padrão' : 'Definir ' + (agendaView === 'lista' ? 'lista' : 'calendário') + ' como visualização padrão',
          defaultIconStyle: 'font-size:16px;font-variation-settings:\'FILL\' ' + (agendaView === this.state.agendaDefault ? 1 : 0),
          defaultBtnStyle: 'height:30px;padding:0 10px;border-radius:9999px;font-family:inherit;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;cursor:pointer;transition:all .2s;'
            + (agendaView === this.state.agendaDefault ? 'border:1px solid #d1fae5;background:#ecfdf5;color:#047857;' : 'border:1px dashed #A192A6;background:#ffffff;color:#4A1259;'),
          setDefaultView: () => {
            if (agendaView === this.state.agendaDefault) return;
            try { window.localStorage.setItem('agenda-view-padrao', agendaView); } catch (err) { /* armazenamento indisponível */ }
            this.setState({ agendaDefault: agendaView, toast: (agendaView === 'lista' ? 'Lista' : 'Calendário') + ' definido como padrão' });
            clearTimeout(this.toastTimer);
            this.toastTimer = setTimeout(() => this.setState({ toast: '' }), 2500);
          },
          calTitle: meses[m - 1] + ' de ' + y,
          prevMonth: () => this.setState({ calMonth: shiftMonth(-1) }),
          nextMonth: () => this.setState({ calMonth: shiftMonth(1) }),
          calCells: cells,
          dayTitle: (calDay === today ? 'Hoje, ' : '') + Number(sd) + ' de ' + meses[Number(sm) - 1],
          dayCount: items.length ? items.length + ' agendamento' + (items.length > 1 ? 's' : '') : '',
          dayEmpty: items.length === 0,
          dayItems: items.map((n) => this.agendaCard(n)),
          createOnDay: () => this.setState({ notaOpen: true, ...Component.emptyForm(), fAlert: true, fDate: calDay, fTime: '09:00', fAvisos: ['1h'] })
        };
      }

                + (sel ? 'border:1.5px solid ' + o.color + ';background:' + o.color + '14;color:' + o.color + ';' : 'border:1px solid #ccc3d8;background:#ffffff;color:#4a4455;'),

          checkItems: fChecklist.map((c) => ({

            toggle: () => this.setState({ fChecklist: this.state.fChecklist.map((x) => (x.id === c.id ? { ...x, done: !x.done } : x)) }),

          { id: 'financeiro', label: 'Financeiro' }

          notifEmpty: visible.length === 0,

      // Atalho para instalar o app na tela inicial (tela cheia).
      instalarVals() {
        if (!this.__refreshLigado) { this.__refreshLigado = true; window.__ilevaRefresh = () => this.setState({}); }
        let dispensado = false, instalado = false;
        try { dispensado = localStorage.getItem('ileva-instalar-dispensado') === '1'; instalado = localStorage.getItem('ileva-instalado') === '1'; } catch (err) { /* armazenamento indisponível */ }
        const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
        const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const celular = document.documentElement.classList.contains('is-mobile');
        const podeInstalar = !!window.__convite || ios;
        return {
          instalarMostrar: celular && podeInstalar && !standalone && !dispensado && !instalado && !this.state.instalarFechado,
          instalarAgora: () => {
            if (window.__convite) {
              const convite = window.__convite;
              convite.prompt();
              convite.userChoice.then((r) => { if (r && r.outcome === 'accepted') { window.__convite = null; this.setState({ instalarFechado: true }); } }).catch(() => { });
            } else this.setState({ instalarGuia: true });
          },
          instalarFechar: () => { try { localStorage.setItem('ileva-instalar-dispensado', '1'); } catch (err) { /* armazenamento indisponível */ } this.setState({ instalarFechado: true }); },
          instalarGuia: !!this.state.instalarGuia,
          instalarGuiaFechar: () => this.setState({ instalarGuia: false })
        };
      }

          preventNative: (e) => e.preventDefault(),
          onClickCapture: (e) => {
            if (this.justDragged) { e.preventDefault(); e.stopPropagation(); }
          },
          sugestoes: this.carouselVals('sugestoes'),
          atalhos: this.carouselVals('atalhos'),
          atalhoItems: this.atalhos.map((item) => {
            const selected = item.id === atalho;
            return {
              ...item,
              pressed: selected ? 'true' : 'false',
              pick: () => this.setState({ atalho: item.id, multiOpen: item.id === 'multiplicador', indicOpen: item.id === 'indicadores', indicView: 'lista' }),
              cardStyle: cardBase + (selected
                ? 'background:#4A1259;color:#ffffff;box-shadow:0 6px 16px -4px rgba(74, 18, 89,0.45);'
                : 'background:#ffffff;color:#0b1c30;box-shadow:0 2px 10px -2px rgba(32, 7, 38,0.10);'),
              iconStyle: 'font-size:22px;font-variation-settings:\'FILL\' 1;color:' + (selected ? '#ffffff' : '#4A1259')
            };
          })
        };
      }
    }

    mountDC(document.getElementById('dc-template').textContent, Component, document.getElementById('root'));
  </script>
