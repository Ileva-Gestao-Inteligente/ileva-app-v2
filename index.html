<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A1259">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ileva Consultor">
<title>ileva · App do Consultor (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>
body{margin:0;background:#eef1f9}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;display:inline-block;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
.nosb{scrollbar-width:none}
.nosb::-webkit-scrollbar{display:none}
main>*,[aria-label="Menu"]>*{flex-shrink:0}
html,body{height:100%}
.app-root{height:100vh!important;height:100dvh!important}
a{color:#4A1259}a:hover{color:#4A1259}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.menu-panel{will-change:transform,opacity}
.menu-in{animation:menuIn .42s cubic-bezier(.22,1,.36,1) both}
.menu-out{animation:menuOut .26s cubic-bezier(.4,0,1,1) both}
.menu-in .menu-avatar{animation:avatarPop .5s cubic-bezier(.34,1.56,.64,1) .08s both}
.menu-in .menu-stagger>*{animation:itemIn .45s cubic-bezier(.22,1,.36,1) both}
.menu-in .menu-stagger>*:nth-child(1){animation-delay:.10s}
.menu-in .menu-stagger>*:nth-child(2){animation-delay:.15s}
.menu-in .menu-stagger>*:nth-child(3){animation-delay:.20s}
.menu-in .menu-stagger>*:nth-child(4){animation-delay:.25s}
.menu-close{transition:transform .25s cubic-bezier(.22,1,.36,1),filter .2s ease}
.menu-close:hover{transform:rotate(90deg);filter:brightness(1.15)}
.menu-close:active{transform:scale(.92)}
.fab-glass{transition:transform .25s cubic-bezier(.22,1,.36,1),filter .2s ease}
.fab-glass:hover{transform:scale(1.05);filter:brightness(1.1)}
.fab-glass:active{transform:scale(.92)}
.ia-fab{transition:transform .25s cubic-bezier(.22,1,.36,1),filter .2s ease}
.ia-fab:hover{filter:brightness(1.1);transform:scale(1.05)}
.ia-fab:active{transform:scale(.92)}
.ia-icon{transition:transform .3s cubic-bezier(.22,1,.36,1)}
.ia-menu{transform-origin:bottom right;animation:iaMenuIn .32s cubic-bezier(.22,1,.36,1) both}
.ia-menu>*{animation:itemIn .38s cubic-bezier(.22,1,.36,1) both}
.ia-menu>*:nth-child(8){animation-delay:0s}.ia-menu>*:nth-child(7){animation-delay:.02s}.ia-menu>*:nth-child(6){animation-delay:.03s}.ia-menu>*:nth-child(5){animation-delay:.05s}.ia-menu>*:nth-child(4){animation-delay:.07s}.ia-menu>*:nth-child(3){animation-delay:.11s}.ia-menu>*:nth-child(2){animation-delay:.15s}.ia-menu>*:nth-child(1){animation-delay:.19s}
.cot-menu{transform-origin:bottom center;animation:iaMenuIn .32s cubic-bezier(.22,1,.36,1) both}
.cot-menu>*{animation:itemIn .38s cubic-bezier(.22,1,.36,1) both}
.cot-menu>*:nth-child(3){animation-delay:.05s}.cot-menu>*:nth-child(2){animation-delay:.10s}.cot-menu>*:nth-child(1){animation-delay:.15s}
.fab-glass:hover .ia-icon{transform:none}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;box-sizing:border-box;line-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{opacity:.6}
label{min-width:0}
.pulse-dot{animation:pulseDot 1.6s ease-in-out infinite}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0.6)}50%{box-shadow:0 0 0 4px rgba(245,158,11,0)}}
.drag-row{cursor:grab;user-select:none;-webkit-user-select:none}
.drag-row.is-dragging{cursor:grabbing}
.drag-row.is-dragging,.drag-row.is-gliding{scroll-snap-type:none!important;scroll-behavior:auto!important}
.drag-row.is-dragging>*{pointer-events:none}
.drag-row.is-dragging *{cursor:grabbing!important}
.nav-raised{z-index:32!important}
.acc-panel{animation:accIn .28s cubic-bezier(.22,1,.36,1) both;transform-origin:top}
@keyframes accIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.prop-card{transition:box-shadow .2s ease,border-color .2s ease}
.prop-card:hover{border-color:#d9cfdc;box-shadow:0 6px 16px -8px rgba(32,7,38,0.18)}
.prop-act{transition:background .15s ease}
.prop-act:hover{background:#f4f0f5}
@media (hover: none) and (pointer: coarse){input,select,textarea{font-size:16px!important}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.step-card{animation:itemIn .3s cubic-bezier(.22,1,.36,1) both}
.price-pop{animation:avatarPop .35s cubic-bezier(.34,1.56,.64,1)}
.story>span:first-child{transition:transform .2s cubic-bezier(.22,1,.36,1)}
.story:hover>span:first-child{transform:scale(1.05)}
.story:active>span:first-child{transform:scale(.92)}
.lamp-btn{transition:transform .2s cubic-bezier(.22,1,.36,1)}
.lamp-btn:hover{transform:translateX(2px)}
.lamp-btn:active{transform:scale(.94)}
.ia-menu.ia-menu-center{transform-origin:center center}
.ia-menu-center::-webkit-scrollbar{display:none}
.agenda-card{transition:box-shadow .2s ease}
.agenda-card:hover{box-shadow:0 8px 20px -8px rgba(74, 18, 89,0.25)!important}
.multi-card{transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s ease}
.multi-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(74, 18, 89,0.28)!important}
.multi-card:active{transform:scale(.98)}
.multi-list>*{flex-shrink:0;animation:itemIn .42s cubic-bezier(.22,1,.36,1) both}
.multi-list>*:nth-child(1){animation-delay:.10s}.multi-list>*:nth-child(2){animation-delay:.15s}.multi-list>*:nth-child(3){animation-delay:.20s}.multi-list>*:nth-child(4){animation-delay:.25s}
.ia-opt{transition:transform .2s cubic-bezier(.22,1,.36,1)}
.ia-opt:hover{transform:translateX(-3px)}
.ia-opt:active{transform:scale(.98)}
@keyframes iaMenuIn{from{transform:scale(.85) translateY(12px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.cta-perf{transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s ease}
.cta-perf:hover{transform:translateY(-1px);box-shadow:0 8px 20px -6px rgba(74, 18, 89,0.3)!important}
.cta-perf:active{transform:scale(.98)}
.dicas-list>*{flex-shrink:0;animation:itemIn .45s cubic-bezier(.22,1,.36,1) both}
.dicas-list>*:nth-child(1){animation-delay:.12s}.dicas-list>*:nth-child(2){animation-delay:.17s}.dicas-list>*:nth-child(3){animation-delay:.22s}.dicas-list>*:nth-child(4){animation-delay:.27s}.dicas-list>*:nth-child(5){animation-delay:.32s}
@keyframes menuIn{from{transform:translateX(100%);opacity:.6}to{transform:translateX(0);opacity:1}}
@keyframes menuOut{from{transform:translateX(0);opacity:1}to{transform:translateX(100%);opacity:.6}}
@keyframes avatarPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes itemIn{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
@media (prefers-reduced-motion: reduce){[role=dialog],.menu-in,.menu-out,.menu-in *,.dicas-list>*,.ia-menu,.ia-menu>*,.cot-menu,.cot-menu>*,.multi-list>*,.pulse-dot{animation:none!important;transition:none!important}}
</style>
<style>
/* ===== Detecção de dispositivo: mobile ocupa a tela toda; desktop mostra o app dentro de um celular ===== */
html,body{margin:0;height:100%}
#root{height:100%}
html.is-mobile body{background:#eef1f9}
html.is-mobile .app-root{max-width:none!important;padding-top:env(safe-area-inset-top,0px)}
html.is-desktop body{background:radial-gradient(circle at 20% 10%,#f4f0f5 0%,#e6dfe9 45%,#d9cfdc 100%);overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
html.is-desktop .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:56px}
html.is-desktop .device{position:relative;flex-shrink:0;width:390px;height:844px;border-radius:52px;padding:12px;background:#1b1420;box-shadow:0 40px 80px -24px rgba(32,7,38,.55),inset 0 0 0 2px #3a2e40;transform-origin:center}
html.is-desktop .screen{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:#eef1f9;transform:translateZ(0)}
html.is-desktop .screen .app-root{height:100%!important;max-width:none!important}
html.is-desktop .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:30px;border-radius:0 0 18px 18px;background:#1b1420;z-index:100;pointer-events:none}
html.is-desktop .info{max-width:300px;color:#350C40}
html.is-desktop .info h1{margin:0 0 8px;font-size:26px;line-height:32px;letter-spacing:-.02em}
html.is-desktop .info p{margin:0 0 14px;font-size:14px;line-height:21px;color:#622773}
html.is-desktop .info .tag{display:inline-block;margin-bottom:14px;padding:4px 10px;border-radius:9999px;background:#4A1259;color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em}
html.is-mobile .info,html.is-mobile .notch{display:none}
@media (max-width:820px){html.is-desktop .info{display:none}}
</style>
</head>
<body>
<div class="stage">
<div class="info">
<span class="tag">PROTÓTIPO</span>
<h1>App do Consultor ileva</h1>
<p>Esta é uma versão de testes. Os dados são fictícios e as alterações ficam salvas só neste navegador.</p>
<p>Para a melhor experiência, abra este mesmo endereço no celular. O layout se adapta e ocupa a tela inteira.</p>
</div>
<div class="device"><div class="screen"><div class="notch"></div><div id="root"></div></div></div>
</div>
<script type="text/plain" id="dc-template"><div class="app-root" style="position: relative; width: 100%; max-width: 480px; margin: 0 auto; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #eef1f9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0b1c30; overflow: hidden">

<header style="position: relative; z-index: 1; height: 80px; margin-bottom: -2px; flex-shrink: 0; box-sizing: border-box; padding: 8px 20px 0; display: flex; align-items: center; justify-content: space-between; background: #4A1259">
<div style="display: flex; align-items: center; gap: 10px">
<div style="position: relative; width: 48px; height: 48px">
<img src="assets/foto-perfil.jpg" alt="Foto de perfil de Carlos Eduardo" style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 9999px; border: 2px solid rgba(255,255,255,0.85); object-fit: cover; object-position: center 30%; display: block; box-shadow: 0 1px 2px rgba(0,0,0,0.06)">
<span style="position: absolute; bottom: 0; right: -2px; width: 10px; height: 10px; border-radius: 9999px; background: #34d399; border: 2px solid #4A1259"></span>
</div>
<div style="display: flex; flex-direction: column">
<span style="font-size: 11px; font-weight: 500; color: #f4f0f5; line-height: 14px">Bem-vindo de volta,</span>
<h1 style="margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; line-height: 22px; color: #ffffff">Carlos Eduardo</h1>
<span style="font-size: 10px; font-weight: 500; color: #f4f0f5; line-height: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px">Regional (Centro-Oeste) / Equipe (Lobo Guará)</span>
</div>
</div>
<div style="flex-shrink: 0; display: flex; align-items: center; margin-right: -10px">
<button onClick="{{openNotif}}" aria-label="{{bellLabel}}" aria-haspopup="dialog" style="position: relative; width: 44px; height: 44px; border: 0; background: transparent; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: #ffffff; cursor: pointer">
<span class="ms" style="font-size: 24px">notifications</span>
<sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}">
<span style="position: absolute; top: 6px; right: 5px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 9999px; background: #ffffff; border: 2px solid #4A1259; color: #4A1259; font-size: 10px; font-weight: 800; line-height: 14px; text-align: center">{{unreadCount}}</span>
</sc-if>
</button>
</div>
</header>

<main class="nosb" style="flex-grow: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 24px">

<div style="flex-shrink: 0; position: relative; margin: -16px -20px 0; padding: 6px 20px 0">
<span aria-hidden="true" style="position: absolute; top: -4px; left: 0; right: 0; height: calc(50% + 7px); border-radius: 0; background: #4A1259"></span>
<button class="cta-perf" onClick="{{openDesempenho}}" aria-label="Abrir Meu desempenho" style="position: relative; flex-shrink: 0; width: 100%; padding: 9px 10px 9px 9px; border: 1px solid #ece6ee; border-radius: 14px; background: linear-gradient(100deg, #ffffff 0%, #f9f6fa 100%); font-family: inherit; color: #0b1c30; text-align: left; display: flex; align-items: center; gap: 10px; cursor: pointer; box-shadow: 0 8px 20px -8px rgba(32, 7, 38,0.35)">
<span style="flex-shrink: 0; width: 36px; height: 36px; box-sizing: border-box; border-radius: 10px; border: 1.5px solid #A192A6; color: #4A1259; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 20px">monitoring</span></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 14px; line-height: 18px; font-weight: 700; color: #0b1c30">Meu desempenho</span>
<span style="font-size: 11px; line-height: 14px; color: #7b7487; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Saldo, metas, indicadores e ranking</span>
</span>
<span style="flex-shrink: 0; width: 28px; height: 28px; border-radius: 9999px; background: #f4f0f5; color: #4A1259; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px">chevron_right</span></span>
</button>
</div>

<section aria-label="Atalhos" style="flex-shrink: 0; margin-top: -8px">
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding-top: 4px">
<sc-for list="{{homeShortcuts}}" as="hs" hint-placeholder-count="5">
<button class="story" onClick="{{hs.go}}" aria-label="{{hs.label}}" style="min-width: 0; padding: 0; border: 0; background: transparent; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer">
<span style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 9999px; background: #ffffff; box-shadow: 0 2px 8px -2px rgba(32, 7, 38,0.12)">
<span style="width: 100%; height: 100%; box-sizing: border-box; border-radius: 9999px; background: #ffffff; display: flex; align-items: center; justify-content: center">
<span class="ms" style="{{hs.iconStyle}}">{{hs.icon}}</span>
</span>
</span>
<span style="max-width: 100%; font-size: 10px; line-height: 12px; font-weight: 600; color: #0b1c30; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{hs.short}}</span>
</button>
</sc-for>
<button class="story" onClick="{{openAtalhos}}" aria-label="Personalizar atalhos" aria-haspopup="dialog" style="min-width: 0; padding: 0; border: 0; background: transparent; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer">
<span style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 9999px; background: #ffffff; box-shadow: 0 2px 8px -2px rgba(32, 7, 38,0.12); color: #4A1259; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 22px; font-variation-settings: 'FILL' 1">add</span></span>
<span style="font-size: 10px; line-height: 12px; font-weight: 600; color: #0b1c30; white-space: nowrap">Editar</span>
</button>
</div>
</section>

<div style="flex-shrink: 0; padding: 16px 12px; border-radius: 16px; background: #ffffff; border: 1px solid #e5eeff; box-shadow: 0 2px 12px -2px rgba(32, 7, 38,0.06); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px">
<h3 style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 700">Conversão do funil</h3>
</div>
<span style="flex-shrink: 0; margin-top: -6px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><strong style="font-size: 17px; line-height: 20px; color: #4A1259">{{funilConv}}</strong><span style="font-size: 11px; line-height: 13px; color: #4a4455">conversão geral</span></span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{funilSteps}}" as="st" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-if value="{{st.hasDrop}}" hint-placeholder-val="{{ false }}">
<div style="{{st.dropStyle}}">
<span class="ms" style="font-size: 13px">south</span>
<span>{{st.dropText}}</span>
</div>
</sc-if>
<div style="display: flex; align-items: center; gap: 4px">
<div style="flex-grow: 1; min-width: 0; height: 26px; border-radius: 8px; background: #eff4ff; overflow: hidden">
<div style="{{st.barStyle}}">
<span style="display: block; font-size: 11px; line-height: 1; font-weight: 700; color: #ffffff; white-space: nowrap">{{st.label}}</span>
<span style="display: block; font-size: 12px; line-height: 1; font-weight: 800; color: #ffffff">{{st.count}}</span>
</div>
</div>
<span style="{{st.timeStyle}}">{{st.time}}</span>
</div>
</div>
</sc-for>
</div>
<button class="lamp-btn" onClick="{{openAnalise}}" aria-haspopup="dialog" style="align-self: flex-start; min-height: 32px; padding: 0 2px; border: 0; background: transparent; font-family: inherit; font-size: 12px; font-weight: 700; color: #4A1259; display: flex; align-items: center; gap: 6px; cursor: pointer">
<span style="position: relative; display: flex"><span class="ms" style="font-size: 18px; color: #d97706; font-variation-settings: 'FILL' 1">lightbulb</span><span class="pulse-dot" style="position: absolute; top: -1px; right: -2px; width: 6px; height: 6px; border-radius: 9999px; background: #f59e0b"></span></span>
<span>Conferir a análise do funil</span>
<span class="ms" style="font-size: 16px">arrow_forward</span>
</button>
</div>

<section style="background: #ffffff; border-radius: 16px; padding: 16px; border: 1px solid #eff4ff; box-shadow: 0 2px 12px -2px rgba(32, 7, 38,0.06); display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 6px">
<span class="ms" style="font-size: 20px; color: #622773">directions_car</span>
<h3 style="margin: 0; font-size: 14px; font-weight: 700">Base de Veículos</h3>
</div>

</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding-top: 4px">
<div style="background: rgba(239,244,255,0.7); border-radius: 12px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #4a4455"><span style="width: 6px; height: 6px; border-radius: 9999px; background: #10b981"></span>Ativos</span>
<span style="font-size: 13px; font-weight: 700">36</span>
</div>
<div style="background: #fff7ed; border: 1px solid #fcd9a8; border-radius: 12px; padding: 7px 1px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #b45309"><span class="pulse-dot" style="width: 6px; height: 6px; border-radius: 9999px; background: #f59e0b"></span>Inadimpl.</span>
<span style="font-size: 13px; font-weight: 700; color: #b45309">5</span>
</div>
<div style="background: rgba(239,244,255,0.7); border-radius: 12px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #4a4455"><span style="width: 6px; height: 6px; border-radius: 9999px; background: #7b7487"></span>Inativos</span>
<span style="font-size: 13px; font-weight: 700; color: #4a4455">4</span>
</div>
<div style="background: rgba(239,244,255,0.7); border-radius: 12px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #4a4455"><span style="width: 6px; height: 6px; border-radius: 9999px; background: #4A1259"></span>Total</span>
<span style="font-size: 13px; font-weight: 700; color: #4A1259">45</span>
</div>
</div>

<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #4a4455">Cor</span><input type="text" value="{{vcCor}}" onChange="{{onVcCor}}" placeholder="Ex.: Prata" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #ccc3d8; border-radius: 12px; background: #ffffff; font-family: inherit; font-size: 14px; color: #0b1c30; outline-color: #4A1259; width: 100%"></label>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script>
/* Runtime mínimo que interpreta o template do Claude Design (x-dc) com React.
   - parseTemplate: tokeniza o HTML do template (preservando maiúsculas dos atributos, ex.: onClick)
   - render: percorre a árvore, resolve {{holes}}, <sc-for> e <sc-if>, e cria elementos React */
(function () {
  const VOID = new Set(['input', 'img', 'br', 'hr', 'meta', 'link', 'source']);
  const ENT = { '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"', '&#39;': "'", '&nbsp;': '\u00a0' };
  const decode = (t) => t.replace(/&(amp|lt|gt|quot|#39|nbsp);/g, (m) => ENT[m]);

  function parseTemplate(src) {
    const root = { tag: '#root', attrs: {}, children: [] };
    const stack = [root];
    let i = 0;
    const n = src.length;
    while (i < n) {
      if (src[i] === '<') {
        if (src.startsWith('<!--', i)) { i = src.indexOf('-->', i) + 3; continue; }
        if (src[i + 1] === '/') {
          const end = src.indexOf('>', i);
          const name = src.slice(i + 2, end).trim().toLowerCase();
          for (let k = stack.length - 1; k > 0; k--) { if (stack[k].tag === name) { stack.length = k; break; } }
          i = end + 1; continue;
        }
        let j = i + 1;
        while (j < n && /[\w-]/.test(src[j])) j++;
        const tag = src.slice(i + 1, j).toLowerCase();
        const attrs = {};
        let selfClose = false;
        while (j < n) {
          while (/\s/.test(src[j])) j++;
          if (src[j] === '>') { j++; break; }
          if (src[j] === '/' && src[j + 1] === '>') { selfClose = true; j += 2; break; }
          let k = j;
          while (k < n && !/[\s=>/]/.test(src[k])) k++;
          const name = src.slice(j, k);
          j = k;
          while (/\s/.test(src[j])) j++;
          if (src[j] === '=') {
            j++;
            while (/\s/.test(src[j])) j++;
            const q = src[j];
            if (q === '"' || q === "'") {
              const e = src.indexOf(q, j + 1);
              attrs[name] = decode(src.slice(j + 1, e));
              j = e + 1;
            } else {
              let e = j; while (e < n && !/[\s>]/.test(src[e])) e++;
              attrs[name] = decode(src.slice(j, e)); j = e;
            }
          } else if (name) attrs[name] = true;
        }
        const node = { tag, attrs, children: [] };
        stack[stack.length - 1].children.push(node);
        if (!selfClose && !VOID.has(tag)) stack.push(node);
        i = j;
      } else {
        const e = src.indexOf('<', i);
        const text = src.slice(i, e === -1 ? n : e);
        if (!/^\s*$/.test(text) || !/\n/.test(text)) stack[stack.length - 1].children.push({ text: decode(text) });
        i = e === -1 ? n : e;
      }
    }
    return root;
  }

  const HOLE = /\{\{([^}]*)\}\}/g;
  const FULL = /^\{\{([^}]*)\}\}$/;
  function evalExpr(expr, scope) {
    const e = expr.trim();
    if (e === 'true') return true;
    if (e === 'false') return false;
    if (e === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(e)) return Number(e);
    const parts = e.split('.');
    let v;
    for (let s = scope; s; s = s.__parent) { if (Object.prototype.hasOwnProperty.call(s, parts[0])) { v = s[parts[0]]; break; } }
    for (let k = 1; k < parts.length && v != null; k++) v = v[parts[k]];
    return v;
  }
  function interp(str, scope) {
    if (typeof str !== 'string') return str;
    const m = str.match(FULL);

  brl(v) {
    return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  planPrice(plan, fipe, cotaId) {
    if (plan.base == null) return null;
    const cat = Component.ccCatalog();
    const factor = fipe < 15000 ? 0.8 : fipe < 40000 ? 1 : fipe < 100000 ? 1.25 : 1.6;
    const cota = cat.cotas.find((c) => c.id === (cotaId || '0')) || cat.cotas[0];
    return Math.round(plan.base * factor * cota.mult * 10) / 10;
  }

  fipeFor(tipo, marca, modelo, ano) {
    const cat = Component.ccCatalog();
    const base = ((cat.marcas[tipo] || {})[marca] || {})[modelo];
    if (!base || !ano) return { fipe: 0, code: '' };
    const age = Math.max(0, 2025 - Number(ano));
    const fipe = Math.round(base * Math.max(0.35, 1 - age * 0.045));
    let h = 0; for (const ch of modelo + ano) h = (h * 31 + ch.charCodeAt(0)) % 999999;
    return { fipe, code: String(h).padStart(6, '0') + '-' + (h % 9) };
  }

  dragRow(key, opts = {}) {
    this.rowEls = this.rowEls || {};
    const snap = opts.snap || 0;
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    const animateTo = (el, target, duration) => {
      cancelAnimationFrame(this.rowAnim);
      const from = el.scrollLeft;
      const max = el.scrollWidth - el.clientWidth;
      const to = Math.max(0, Math.min(max, target));
      const start = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - start) / duration);
        el.scrollLeft = from + (to - from) * ease(t);
        if (t < 1) this.rowAnim = requestAnimationFrame(step);
        else el.classList.remove('is-gliding');
      };
      el.classList.add('is-gliding');
      this.rowAnim = requestAnimationFrame(step);
    };
    return {
      ref: (el) => { this.rowEls[key] = el; },
      down: (e) => {
        const el = this.rowEls[key];
        if (e.button !== 0 || !el) return;
        cancelAnimationFrame(this.rowAnim);
        el.classList.remove('is-gliding');
        this.rowDrag = { key, startX: e.pageX, start: el.scrollLeft, moved: false, lastX: e.pageX, lastT: performance.now(), v: 0 };
      },
      move: (e) => {
        const d = this.rowDrag;
        if (!d || d.key !== key) return;
        const el = this.rowEls[key];
        const dist = e.pageX - d.startX;
        if (!d.moved && Math.abs(dist) > 5) { d.moved = true; el.classList.add('is-dragging'); }
        if (!d.moved) return;
        e.preventDefault();
        const now = performance.now();
        const dt = Math.max(1, now - d.lastT);
        d.v = 0.8 * ((e.pageX - d.lastX) / dt) + 0.2 * d.v;
        d.lastX = e.pageX; d.lastT = now;
        d.target = d.start - dist;
        if (!d.raf) d.raf = requestAnimationFrame(() => { d.raf = null; el.scrollLeft = d.target; });
      },
      up: () => {
        const d = this.rowDrag;
        if (!d || d.key !== key) return;
        this.rowDrag = null;
        const el = this.rowEls[key];
        if (!el) return;
        el.classList.remove('is-dragging');
        if (!d.moved) return;
        this.justDragged = true;
        setTimeout(() => { this.justDragged = false; }, 50);
        const momentum = -d.v * 220;
        const projected = (d.target ?? el.scrollLeft) + momentum;
        const target = snap ? Math.round(projected / snap) * snap : projected;
        animateTo(el, target, snap ? 420 : 520);
      }
    };
  }

  propVals() {

      if (!date) return false;
      if (f.preset === 'mes') return date.slice(0, 7) === today.slice(0, 7);
      if (['30', '60', '90'].includes(f.preset)) return date >= addDays(today, -Number(f.preset)) && date <= today;

  maskPhone(v) {
    const d = v.replace(/\D/g, '').slice(0, 11);
    if (d.length <= 2) return d ? '(' + d : '';
    if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
    if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
    return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
  }

  maskDoc(v) {
    const d = v.replace(/\D/g, '').slice(0, 14);
    if (d.length <= 11) {
      return d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
    }
    return d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
  }

  maskMoney(v) {
    const d = v.replace(/\D/g, '').replace(/^0+/, '').slice(0, 7);
    if (!d) return '';
    const n = Number(d) / 100;
    return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  parseMoney(v) {
    return Number(String(v).replace(/\./g, '').replace(',', '.')) || 0;
  }

    const statusMeta = {
      atrasado: { label: 'Atrasado', color: '#b42318', bg: '#fee4e2' },

    const filters = [

      { id: 'proximo', label: 'Próximos' },
      { id: 'atrasado', label: 'Atrasados' }
    ];
    let list = agendaTab === 'lembretes' ? lembretes : anotacoes;
    if (agendaTab === 'lembretes') {
      if (agendaFilter !== 'todos') list = list.filter((n) => statusOf(n) === agendaFilter);
      list = [...list].sort((a, b) => (a.alertDate + a.alertTime).localeCompare(b.alertDate + b.alertTime));

    const sm = meses[sel];
    const comSel = sm.proj
      ? { label: 'Set · realizado', total: brl(sm.ade + sm.rec), rec: brl(sm.rec), ade: brl(sm.ade) }
      : { label: sm.full, total: brl(sm.ade + sm.rec), rec: brl(sm.rec), ade: brl(sm.ade) };

    // Base: Funil de Propostas (Contato 14, Vistoria 8, Termos 5, Aguardando 6) + 12 ativadas no mês
    const funilAgora = { contato: 14, vistoria: 8, termos: 5, aguardando: 6, ativadas: 12 };
    const fa = funilAgora;
    const steps = [
      { label: 'Propostas no mês', count: fa.contato + fa.vistoria + fa.termos + fa.aguardando + fa.ativadas, hours: 0, parados: 0 },
      { label: 'Passaram do contato', count: fa.vistoria + fa.termos + fa.aguardando + fa.ativadas, hours: 50, parados: fa.contato },
      { label: 'Vistoria', count: fa.termos + fa.aguardando + fa.ativadas, hours: 43, parados: fa.vistoria },
      { label: 'Termos', count: fa.aguardando + fa.ativadas, hours: 26, parados: fa.termos },
      { label: 'Ativadas', count: fa.ativadas, hours: 19, parados: fa.aguardando }
    ];
    const totalFunil = steps[0].count;
    const rates = steps.map((st, i) => (i ? st.count / steps[i - 1].count : 1));
    const parados = steps.map((st) => st.parados);
    const worstIdx = parados.indexOf(Math.max(...parados));
    const shortTime = (h) => { const d = Math.floor(h / 24), r = h % 24; return h ? (d ? d + 'd' + (r ? ' ' + r + 'h' : '') : r + 'h') : ''; };
    const longTime = (h) => { const d = Math.floor(h / 24), r = h % 24; const dd = d ? d + (d === 1 ? ' dia' : ' dias') : ''; const hh = r ? r + (r === 1 ? ' hora' : ' horas') : ''; return [dd, hh].filter(Boolean).join(' e '); };
    steps.forEach((st) => { st.time = shortTime(st.hours); st.timeLong = longTime(st.hours); });
    const times = steps.map((st) => st.hours);
    const slowIdx = times.indexOf(Math.max(...times));
    const funilSteps = steps.map((st, i) => {
      const prev = i ? steps[i - 1].count : st.count;
      const rate = Math.round((st.count / prev) * 100);
      const worst = i === worstIdx;
      return {
        ...st,
        hasDrop: i > 0,
        dropText: rate + '% seguiram · ' + st.parados + ' parados na etapa anterior',
        dropStyle: 'display:flex;align-items:center;gap:5px;padding-left:8px;font-size:10px;line-height:13px;font-weight:' + (worst ? '700' : '500') + ';color:' + (worst ? '#b42318' : '#7b7487'),
        barStyle: 'height:100%;width:' + Math.max(42, (st.count / totalFunil) * 100) + '%;box-sizing:border-box;padding:0 8px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1;background:'
          + (i === steps.length - 1 ? '#059669' : '#4A1259'),
        timeStyle: 'flex-shrink:0;width:34px;line-height:1;font-size:10px;letter-spacing:-0.01em;white-space:nowrap;font-weight:' + (i === slowIdx ? '800' : '600') + ';color:' + (i === slowIdx ? '#4a4455' : '#7b7487') + (st.time ? '' : ';visibility:hidden')
      };
    });
    const etapaNome = ['', 'primeiro contato', 'vistoria', 'assinatura dos termos', 'ativação'][worstIdx];
    const funilConv = Math.round((fa.ativadas / totalFunil) * 100) + '%';
    const etapaFiltro = ['', 'Plano', 'Vistoria', 'Termo', 'Ativação'][worstIdx];
    const analise = {
      etapa: etapaNome.charAt(0).toUpperCase() + etapaNome.slice(1) + (worstIdx === slowIdx ? ', a etapa mais lenta do seu funil' : ''),
      parados: steps[worstIdx].parados,
      tempo: steps[worstIdx].time
    };
    const analiseGo = () => this.setState({ analiseOpen: false, propOpen: true, propTab: 'funil', propFilters: { ...Component.emptyPropFilters(), etapa: [etapaFiltro] } });
    const funilSub = totalFunil + ' propostas no mês · ' + (totalFunil - fa.ativadas) + ' em andamento';
    const funilDica = 'Gargalo no ' + etapaNome + ': ' + steps[worstIdx].parados + ' propostas estão paradas nessa etapa' + (worstIdx === slowIdx ? ', que também é a mais lenta (' + steps[worstIdx].timeLong + ' em média)' : '') + '. Retornar esses leads em até 24h pode destravar boa parte delas.';

    const risco = [
      { name: 'José Almeida', vehicle: 'Onix 2020', mensalidade: 189, level: 'alto', icon: 'receipt_long', reason: 'Boleto vence em 2 dias · pagou atrasado no mês passado' },
      { name: 'Patrícia Souza', vehicle: 'Argo 2021', mensalidade: 172, level: 'alto', icon: 'support_agent', reason: 'Reclamação aberta no atendimento há 5 dias' },
      { name: 'Fernanda Costa', vehicle: 'Kwid 2022', mensalidade: 129, level: 'medio', icon: 'event_repeat', reason: 'Renovação em 12 dias, sem contato recente' },
      { name: 'Ricardo Lima', vehicle: 'Hilux 2019', mensalidade: 310, level: 'medio', icon: 'car_crash', reason: 'Acionou a assistência 2 vezes este mês' }
    ];
    const f = this.state.riscoFilter;
    const visible = risco.filter((r) => f === 'todos' || r.level === f);
    const lv = { alto: { label: 'Risco alto', color: '#b42318', bg: '#fee4e2' }, medio: { label: 'Risco médio', color: '#b45309', bg: '#fef0c7' } };
    return {
      comBars,
      comSel,
      funilSteps,
      analise,
      analiseGo,
      analiseOpen: !!this.state.analiseOpen,
      openAnalise: () => this.setState({ analiseOpen: true }),
      closeAnalise: () => this.setState({ analiseOpen: false }),
      funilConv,
      funilSub,
      funilDica,
      riscoValor: brl(risco.reduce((t, r) => t + r.mensalidade, 0)),
      riscoFilters: [
        { id: 'todos', label: 'Todos (' + risco.length + ')' },
        { id: 'alto', label: 'Alto' },
        { id: 'medio', label: 'Médio' }
      ].map((o) => ({ ...o, selected: o.id === f ? 'true' : 'false', style: this.chipStyle(o.id === f), pick: () => this.setState({ riscoFilter: o.id }) })),
      riscoItems: visible.map((r, i) => ({
        ...r,
        initials: r.name.split(' ').map((w) => w[0]).join(''),
        mensalidade: brl(r.mensalidade),
        levelLabel: lv[r.level].label,
        levelStyle: 'flex-shrink:0;font-size:10px;font-weight:800;padding:2px 6px;border-radius:9999px;color:' + lv[r.level].color + ';background:' + lv[r.level].bg,
        reasonStyle: 'display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:' + lv[r.level].color,
        whatsLabel: 'Falar com ' + r.name + ' no WhatsApp',
        whatsUrl: 'https://wa.me/?text=' + encodeURIComponent('Olá, ' + r.name.split(' ')[0] + '! Aqui é o Carlos Eduardo, seu consultor ileva. Posso te ajudar com alguma coisa na sua proteção?'),
        rowStyle: 'display:flex;align-items:center;gap:10px;padding:12px;' + (i < visible.length - 1 ? 'border-bottom:1px solid #eff4ff;' : ''),
        avatarStyle: 'flex-shrink:0;width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:' + lv[r.level].color + ';background:' + lv[r.level].bg
      }))
    };
  }

      cardStyle: 'flex-shrink:0;padding:14px;border-radius:16px;background:#ffffff;border:1px solid #e5eeff;box-shadow:0 2px 12px -2px rgba(32, 7, 38,0.06);display:flex;flex-direction:column;gap:8px;animation:itemIn .35s cubic-bezier(.22,1,.36,1) both',

      status: st.label,

  calendarVals() {
    const { agendaView, calMonth, calDay, notas } = this.state;
    const today = '2026-09-30';
    const pad = (n) => String(n).padStart(2, '0');
    const [y, m] = calMonth.split('-').map(Number);
    const first = new Date(Date.UTC(y, m - 1, 1));
    const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const lead = first.getUTCDay();
    const total = Math.ceil((lead + daysInMonth) / 7) * 7;
    const meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
    const lembretes = notas.filter((n) => n.alertDate);
    const colorOf = (d) => (d < today ? '#d92d20' : d === today ? '#f59e0b' : '#4A1259');
    const shiftMonth = (delta) => {
      const d = new Date(Date.UTC(y, m - 1 + delta, 1));
      return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1);
    };
    const cells = Array.from({ length: total }, (_, i) => {
      const date = new Date(Date.UTC(y, m - 1, i - lead + 1));
      const iso = date.getUTCFullYear() + '-' + pad(date.getUTCMonth() + 1) + '-' + pad(date.getUTCDate());
      const inMonth = date.getUTCMonth() === m - 1;
      const isToday = iso === today;
      const selected = iso === calDay;
      const dayItems = lembretes.filter((n) => n.alertDate === iso);
      return {
        day: date.getUTCDate(),
        label: date.getUTCDate() + ' de ' + meses[date.getUTCMonth()] + (dayItems.length ? ', ' + dayItems.length + ' lembrete' + (dayItems.length > 1 ? 's' : '') : ''),
        selected: selected ? 'true' : 'false',
        pick: () => this.setState({ calDay: iso, calMonth: iso.slice(0, 7) }),
        style: 'height:44px;padding:0;border:0;border-radius:12px;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:background .15s;'
          + (selected ? 'background:#4A1259;' : isToday ? 'background:#ece6ee;' : 'background:transparent;'),
        numStyle: 'font-size:13px;line-height:16px;font-weight:' + (isToday || selected ? '800' : '600') + ';color:'
          + (selected ? '#ffffff' : !inMonth ? '#ccc3d8' : isToday ? '#4A1259' : '#0b1c30'),
        dots: dayItems.slice(0, 3).map(() => ({
          style: 'width:5px;height:5px;border-radius:9999px;background:' + (selected ? '#ffffff' : colorOf(iso))
        }))
      };
    });
    const [sy, sm, sd] = calDay.split('-');
    const statusMeta = (d) => (d < today
      ? { label: 'Atrasado', color: '#b42318', bg: '#fee4e2' }
      : d === today ? { label: 'Hoje', color: '#b45309', bg: '#fef0c7' } : { label: 'Agendado', color: '#4A1259', bg: '#ece6ee' });
    const items = lembretes.filter((n) => n.alertDate === calDay).sort((a, b) => a.alertTime.localeCompare(b.alertTime));
    return {
      agendaIsLista: agendaView === 'lista',
      agendaIsCal: agendaView === 'calendario',
      viewToggleIcon: agendaView === 'lista' ? 'calendar_month' : 'view_agenda',
      viewToggleText: agendaView === 'lista' ? 'Calendário' : 'Lista',
      viewToggleLabel: agendaView === 'lista' ? 'Ver em calendário' : 'Ver em lista',
      toggleAgendaView: () => this.setState({ agendaView: agendaView === 'lista' ? 'calendario' : 'lista' }),
      viewOptions: [
        { id: 'lista', label: 'Lista', icon: 'view_agenda' },
        { id: 'calendario', label: 'Calendário', icon: 'calendar_month' }
      ].map((o) => {
        const sel = o.id === agendaView;
        return {
          ...o,
          selected: sel ? 'true' : 'false',
          pick: () => this.setState({ agendaView: o.id }),
          style: 'height:34px;padding:0 10px;border:0;border-radius:9999px;font-family:inherit;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;cursor:pointer;transition:all .2s;'
            + (sel ? 'background:#ffffff;color:#4A1259;box-shadow:0 2px 6px -2px rgba(32, 7, 38,0.25);' : 'background:transparent;color:#4a4455;')
        };
      }),
      isDefaultView: agendaView === this.state.agendaDefault,
      defaultLabel: agendaView === this.state.agendaDefault ? 'Padrão' : 'Definir padrão',
      defaultAria: agendaView === this.state.agendaDefault ? (agendaView === 'lista' ? 'Lista' : 'Calendário') + ' é a visualização padrão' : 'Definir ' + (agendaView === 'lista' ? 'lista' : 'calendário') + ' como visualização padrão',
      defaultIconStyle: 'font-size:16px;font-variation-settings:\'FILL\' ' + (agendaView === this.state.agendaDefault ? 1 : 0),
      defaultBtnStyle: 'height:30px;padding:0 10px;border-radius:9999px;font-family:inherit;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;cursor:pointer;transition:all .2s;'
        + (agendaView === this.state.agendaDefault ? 'border:1px solid #d1fae5;background:#ecfdf5;color:#047857;' : 'border:1px dashed #A192A6;background:#ffffff;color:#4A1259;'),
      setDefaultView: () => {
        if (agendaView === this.state.agendaDefault) return;
        try { window.localStorage.setItem('agenda-view-padrao', agendaView); } catch (err) { /* armazenamento indisponível */ }
        this.setState({ agendaDefault: agendaView, toast: (agendaView === 'lista' ? 'Lista' : 'Calendário') + ' definido como padrão' });
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => this.setState({ toast: '' }), 2500);
      },
      calTitle: meses[m - 1] + ' de ' + y,
      prevMonth: () => this.setState({ calMonth: shiftMonth(-1) }),
      nextMonth: () => this.setState({ calMonth: shiftMonth(1) }),
      calCells: cells,
      dayTitle: (calDay === today ? 'Hoje, ' : '') + Number(sd) + ' de ' + meses[Number(sm) - 1],
      dayCount: items.length ? items.length + ' lembrete' + (items.length > 1 ? 's' : '') : '',
      dayEmpty: items.length === 0,
      dayItems: items.map((n) => this.agendaCard(n)),
      createOnDay: () => this.setState({ notaOpen: true, ...Component.emptyForm(), fAlert: true, fDate: calDay, fTime: '09:00', fAvisos: ['1h'] })
    };
  }

      ...this.agendaVals(),
      ...this.formVals(),
      ...this.calendarVals(),
      agendaOpen: this.state.agendaOpen,
      notaOpen: this.state.notaOpen,
      fTitle: this.state.fTitle,
      fText: this.state.fText,
      fLead: this.state.fLead,
      fAlert: this.state.fAlert,
      fDate: this.state.fDate,
      fTime: this.state.fTime,
      toastVisible: !!this.state.toast,
      toastText: this.state.toast,
      iaAgenda: () => this.setState({ iaOpen: false, agendaOpen: true, agendaTab: 'lembretes', agendaFilter: 'todos', agendaView: this.state.agendaDefault }),
      menuAgenda: (e) => {
        e.preventDefault();
        this.setState({ menuOpen: false, menuClosing: false, agendaOpen: true, agendaTab: 'anotacoes', agendaView: this.state.agendaDefault });
      },
      closeAgenda: () => this.setState({ agendaOpen: false }),
      openNota: () => this.setState({ notaOpen: true, ...Component.emptyForm() }),
      closeNota: () => this.setState({ notaOpen: false }),
      ...this.notifVals(),
      notifOpen: this.state.notifOpen,
      openNotif: () => this.setState({ notifOpen: true, notifFilter: 'todas' }),
      closeNotif: () => this.setState({ notifOpen: false }),
      markAllRead: () => this.setState({ readIds: Object.fromEntries(this.notificacoes.map((n) => [n.id, true])) }),
      matOpen: matView !== null,
      matIsCategorias: matView === 'categorias',
      matIsGaleria: matView === 'galeria',
      matTitle: matView === 'galeria' ? 'ileva' : 'Materiais publicitários',
      openMateriais: () => this.setState({ matView: 'categorias' }),
      multiIsLink: (this.state.multiTab || 'link') === 'link',
      multiIsMat: this.state.multiTab === 'materiais',
      multiTabs: [{ id: 'link', label: 'Link de captação', icon: 'qr_code_2' }, { id: 'materiais', label: 'Materiais', icon: 'photo_library' }].map((t) => {
        const on = (this.state.multiTab || 'link') === t.id;
        return { ...t, selected: on ? 'true' : 'false', pick: () => this.setState({ multiTab: t.id }),
          style: 'height:42px;border:0;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all .2s;' + (on ? 'background:#4A1259;color:#ffffff;' : 'background:transparent;color:#4a4455;') };
      }),
      openGaleria: () => this.setState({ matView: 'galeria' }),
      matBack: () => this.setState({ matView: matView === 'galeria' ? 'categorias' : null }),
      pecasCount: this.pecas.length,
      pecas: this.pecas.map((p) => this.pecaVals(p)),
      previewOpen: !!previewPeca,
      preview: previewPeca ? this.pecaVals(previewPeca) : { title: '', img: '', fileName: '', whatsUrl: '#', share: () => {} },
      closePreview: () => this.setState({ previewId: null }),
      linkOpen,
      indicador,
      linkUrl,
      qrVisible,
      openLink: () => this.setState({ linkOpen: true }),
      closeLink: () => this.setState({ linkOpen: false, qrVisible: false, copied: false }),
      onIndicador: (e) => this.setState({ indicador: e.target.value, copied: false }),
      whatsUrl: 'https://wa.me/?text=' + encodeURIComponent(shareText),
      copyIcon: copied ? 'check' : 'content_copy',
      copyLabel: copied ? 'Copiado!' : 'Copiar link',
      copyLink: () => {
        try { if (navigator.clipboard) navigator.clipboard.writeText(linkUrl).catch(() => {}); } catch (err) { /* sem permissão */ }
        this.setState({ copied: true });
        clearTimeout(this.copyTimer);
        this.copyTimer = setTimeout(() => this.setState({ copied: false }), 2000);
      },
      toggleQr: () => this.setState({ qrVisible: !qrVisible }),
      qrLabel: qrVisible ? 'Ocultar QR Code' : 'Gerar QR Code',
      qrExpanded: qrVisible ? 'true' : 'false',
      shareQr: () => {
        if (navigator.share) {
          navigator.share({ title: 'Link de captação', text: shareText, url: linkUrl }).catch(() => {});
        } else {
          window.open('https://wa.me/?text=' + encodeURIComponent(shareText), '_blank', 'noopener');
        }
      },
      menuMulti: (e) => {
        e.preventDefault();
        this.setState({ menuOpen: false, menuClosing: false, multiOpen: true });
      },
      iaRede: () => this.setState({ iaOpen: false, redeOpen: true, redeExpanded: {} }),
      redeOpen,
      closeRede: () => this.setState({ redeOpen: false }),
      goHome: (e) => {
        e.preventDefault();
        this.setState({ redeOpen: false, multiOpen: false, linkOpen: false, qrVisible: false, matView: null, previewId: null, agendaOpen: false, notaOpen: false, relOpen: false, indOpen: false, indicOpen: false, indicFormOpen: false, novOpen: false, propOpen: false, sheetKey: null, detOpen: false, wizOpen: false, ds: null, cf: null, dicasOpen: false, cotacaoOpen: false, detalheOpen: false, iaOpen: false });
      },
      rede: this.redeSummary(),
      redeRows: this.redeRows(this.rede),
      openDicas: () => this.setState({ dicasOpen: true }),
      closeDicas: () => this.setState({ dicasOpen: false }),
      openCotacao: () => this.setState({ cotacaoOpen: true }),
      toggleCotacao: () => this.setState({ cotacaoOpen: !cotacaoOpen, iaOpen: false }),
      cotacaoIcon: cotacaoOpen ? 'close' : 'add',
      cotacaoLabel: cotacaoOpen ? 'Fechar nova cotação' : 'Nova cotação',
      cotacaoExpanded: cotacaoOpen ? 'true' : 'false',
      cotacaoIconStyle: 'font-size:30px;font-variation-settings:\'wght\' 500;text-shadow:0 1px 2px rgba(32, 7, 38,0.35);transform:rotate(' + (cotacaoOpen ? '90deg' : '0deg') + ')',
      closeCotacao: () => this.setState({ cotacaoOpen: false }),
      menuAnim: menuClosing ? 'menu-out' : 'menu-in',
      openMenu: () => {
        clearTimeout(this.menuTimer);
        this.setState({ menuOpen: true, menuClosing: false });
      },
      closeMenu: () => {
        if (menuClosing) return;
        this.setState({ menuClosing: true });
        this.menuTimer = setTimeout(() => this.setState({ menuOpen: false, menuClosing: false }), 260);
      },
      openDetalhe: () => this.setState({ detalheOpen: true }),
      closeDetalhe: () => this.setState({ detalheOpen: false }),
      disponivel: hidden ? mask : 'R$ 3.200,00',
      potencial: hidden ? mask : 'R$ 5.250,00',
      eyeIcon: hidden ? 'visibility_off' : 'visibility',
      eyeLabel: hidden ? 'Mostrar valores' : 'Ocultar valores',
      toggleSaldo: () => this.setState({ hidden: !hidden }),
      onDragMove: (e) => this.moveDrag(e),
      onDragEnd: () => this.endDrag(),
      preventNative: (e) => e.preventDefault(),
      onClickCapture: (e) => {
        if (this.justDragged) { e.preventDefault(); e.stopPropagation(); }
      },
      sugestoes: this.carouselVals('sugestoes'),
      atalhos: this.carouselVals('atalhos'),
      atalhoItems: this.atalhos.map((item) => {
        const selected = item.id === atalho;
        return {
          ...item,
          pressed: selected ? 'true' : 'false',
          pick: () => this.setState({ atalho: item.id, multiOpen: item.id === 'multiplicador', indicOpen: item.id === 'indicadores', indicView: 'lista' }),
          cardStyle: cardBase + (selected
            ? 'background:#4A1259;color:#ffffff;box-shadow:0 6px 16px -4px rgba(74, 18, 89,0.45);'
            : 'background:#ffffff;color:#0b1c30;box-shadow:0 2px 10px -2px rgba(32, 7, 38,0.10);'),
          iconStyle: 'font-size:22px;font-variation-settings:\'FILL\' 1;color:' + (selected ? '#ffffff' : '#4A1259')
        };
      })
    };
  }
}

mountDC(document.getElementById('dc-template').textContent, Component, document.getElementById('root'));
